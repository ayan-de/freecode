<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Graph Explorer — freecode</title>
    <link rel="stylesheet" href="graph.css" />
  </head>
  <body>
    <header class="bar">
      <div class="title">
        <span class="name">Memory Graph Explorer</span>
        <span id="stats" class="stats"></span>
        <span id="seed-mode" class="badge" hidden></span>
      </div>
      <div class="search">
        <input
          id="q"
          type="search"
          autocomplete="off"
          placeholder="type a query and watch the cascade..."
          spellcheck="false"
        />
      </div>
    </header>
    <main>
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="empty" class="empty" hidden>
        <p>no memories found — nothing to show</p>
      </div>
      <aside id="legend" class="legend">
        <h4>Nodes</h4>
        <ul>
          <li><span class="dot kind-Memory"></span>Memory</li>
          <li><span class="dot kind-Tag"></span>Tag</li>
          <li><span class="dot kind-Cluster"></span>Cluster</li>
        </ul>
        <h4>Edges</h4>
        <ul>
          <li><span class="line HasTag"></span>HasTag</li>
          <li><span class="line RelatesTo"></span>RelatesTo</li>
          <li><span class="line Supersedes"></span>Supersedes</li>
          <li><span class="line InCluster"></span>InCluster</li>
        </ul>
      </aside>
    </main>
    <script src="d3.min.js"></script>
    <script src="graph.js"></script>
  </body>
</html>
