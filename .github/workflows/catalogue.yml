name: Provider catalogue

# The snapshot in apps/core/src/providers/catalogue-snapshot.ts is freecode's
# offline floor for provider identity — what a first run with no disk cache and
# no network uses to construct a provider. models.dev adds and renames
# providers whether or not anyone regenerates it, and nothing about a stale
# snapshot is visible at runtime: it just quietly describes the providers that
# existed the day it was written.
#
# So: check weekly, and open a PR rather than committing to main. The diff is
# provider identity (SDK package, baseURL, env var names) and deserves a human
# read — a provider that changes its npm package changes how freecode talks to
# it.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: catalogue
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Check models.dev for drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether the snapshot is current
        id: check
        # The generator exits 1 on drift; that is the signal, not a failure.
        run: |
          if node scripts/gen-provider-catalogue.mjs --check; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate
        if: steps.check.outputs.drifted == 'true'
        run: node scripts/gen-provider-catalogue.mjs

      - name: Open a pull request
        if: steps.check.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-provider-catalogue
          title: "chore(providers): refresh the models.dev catalogue snapshot"
          commit-message: "chore(providers): refresh the models.dev catalogue snapshot"
          body: |
            Regenerated by `.github/workflows/catalogue.yml` from
            https://models.dev/api.json.

            This is provider *identity* only — id, name, SDK package, baseURL,
            env var names. Model lists and prices are fetched at runtime by
            `models-dev.ts` and are not in this file.

            Worth checking before merging:

            - **A changed `npm` field** alters which SDK builds that provider.
              If it moves to a package `sdk-factories.ts` does not carry, the
              provider stops registering — which is correct, but silent.
            - **A changed `baseURL`** re-points requests.
            - **A new provider** registers automatically if its SDK is one of
              the bundled families; no other change is needed.
          add-paths: apps/core/src/providers/catalogue-snapshot.ts
